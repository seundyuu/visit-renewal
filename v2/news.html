<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Newsroom · VISIT</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap">
<link rel="stylesheet" href="common.css">
<script src="common.js"></script>
<script src="data.js"></script>
<style>
.years{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-bottom:40px}
.years button{height:38px;padding:0 16px;border-radius:999px;border:1px solid var(--line2);background:transparent;color:var(--t2);font:600 14px var(--f-en);cursor:pointer;transition:background .2s,color .2s,border-color .2s}
.years button:hover{color:#fff;border-color:rgba(255,255,255,.3)}
.years button[aria-pressed="true"]{background:#fff;color:#111;border-color:#fff}
.ncards{row-gap:24px}
.loadmore{display:flex;justify-content:center;margin-top:48px}
.loadmore[hidden]{display:none}
.ncard h3{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
</style>
</head>
<body class="lt" data-page="news">
<script>VISIT.header()</script>
<main id="top">
<section class="phero">
    <div class="wrap">
      <p class="eyebrow">Newsroom</p>
      <h1>VISIT의<br>최신 소식</h1>
      <p class="lead">언론과 미디어에 소개된 VISIT의 이야기를 모았습니다.</p>
    </div>
  </section>

  <section class="sec tight line" style="padding-top:clamp(48px,6vw,80px)">
    <div class="wrap">
      <div class="years rv" role="group" aria-label="연도 선택" id="years"></div>
      <div class="ncards" id="list"></div>
      <div class="loadmore"><button class="btn btn-glass" type="button" id="more">더 보기 <span class="arr">↓</span></button></div>
    </div>
  </section>
  <script>VISIT.contact()</script>
</main>
<script>VISIT.footer()</script>
<script>
const STEP=9, list=document.getElementById('list'), more=document.getElementById('more'), yb=document.getElementById('years');
const years=['전체',...new Set(NEWS.map(n=>n[0].slice(0,4)))];
let year='전체', shown=STEP;
yb.innerHTML=years.map(y=>`<button type="button" aria-pressed="${y==='전체'}">${y}</button>`).join('');
const card=n=>`<a class="ncard in-now" href="${n[2]}" target="_blank" rel="noopener"><div class="th"><img src="${n[3]}" alt="" loading="lazy"></div><div class="bd"><div class="meta"><span class="chip"><span class="dot"></span>Newsroom</span><span>${n[0]}</span></div><h3>${n[1]}</h3></div></a>`;
function render(){const items=NEWS.filter(n=>year==='전체'||n[0].startsWith(year));list.innerHTML=items.slice(0,shown).map(card).join('');more.parentElement.hidden=shown>=items.length;}
yb.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;year=b.textContent;shown=STEP;yb.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b));render();});
more.addEventListener('click',()=>{shown+=STEP;render();});
render();
</script>
</body>
</html>
