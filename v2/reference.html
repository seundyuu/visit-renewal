<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reference · VISIT</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap">
<link rel="stylesheet" href="common.css">
<script src="common.js"></script>
<script src="data.js"></script>
<style>
.ncards{row-gap:24px}
</style>
</head>
<body class="lt" data-page="reference">
<script>VISIT.header()</script>
<main id="top">
<section class="phero">
    <div class="wrap">
      <p class="eyebrow">Reference</p>
      <h1>고객 경험으로 본<br>VISIT의 성공 스토리</h1>
      <p class="lead">호텔, 공유 오피스, 쇼핑몰, 부동산까지. 국내외 다양한 기업이 VISIT와 함께 공간의 가치를 높였습니다.</p>
    </div>
  </section>

  <section class="sec tight line ref" style="padding-top:clamp(48px,6vw,80px)">
    <div class="wrap">
      <div class="marq rv" aria-label="고객사 로고">
        <div class="row" id="row1"></div>
        <div class="row rev" id="row2"></div>
      </div>
      <div class="ncards" id="refs" style="margin-top:56px"></div>
    </div>
  </section>
  <script>VISIT.contact()</script>
</main>
<script>VISIT.footer()</script>
<script>
function fillLogos(id,list){const h=list.map(s=>`<div class="logo-chip"><img src="${s}" alt="고객사 로고" loading="lazy"></div>`).join('');document.getElementById(id).innerHTML=h+h+h;}
fillLogos('row1',LOGOS);fillLogos('row2',LOGOS.slice(3).concat(LOGOS.slice(0,3)));
const refCard=r=>`<article class="ncard rv"><div class="th"><img src="${r[3]}" alt="" loading="lazy"></div><div class="bd"><div class="meta"><span class="chip"><span class="dot"></span>Reference</span>${r[2]?`<span>${r[2]}</span>`:''}</div><h3>${r[0]}</h3><p class="sub">${r[1]}</p></div></article>`;
document.getElementById('refs').innerHTML=REFS.map(refCard).join('');
</script>
</body>
</html>
